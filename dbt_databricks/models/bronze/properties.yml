version: 2

models:
  - name: bronze_dim_store #  Must match the filename of a model -- including case sensitivity.
    config:
      materialized: table
      schema: bronze
    columns:
      - name: store_sk
        data_tests:
          - unique
          - not_null
      - name: store_name
        data_tests:
          - accepted_values: 
             arguments:
              values: ['MegaMart Manhattan','MegaMart Austin', 'MegaMart Brooklyn','MegaMart San Jose','MegaMart Toronto']
             config:
                severity: warn

  - name: bronze_dim_product
    config:
      materialized: table
      schema: bronze

  - name: bronze_fact_sales
    columns:
      - name: sales_id
        data_tests:
          - unique
          - not_null
      - name: gross_amount
        data_tests:
          - custom_generic_nonnegative_test
    
